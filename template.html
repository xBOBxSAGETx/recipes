<!DOCTYPE html>
<html lang="en">
<!--
  AGUILLON HOUSE KITCHEN — RECIPE TEMPLATE
  ==========================================
  This is the single source of truth for the house design system. Every recipe in
  /recipes uses this exact <style> block. If you change a design token, change it
  HERE and re-paste into the recipes (or refactor to a shared CSS file later).

  PALETTE (the "pro" palette):
    --char-black #1a1714   ink / rules / headings
    --broth-gold #c8941e   kicker, step circles, accent rules, tags
    --smoke-gray #6b6560   muted/secondary text, notes
    --paper      #f7f4ee   background
    --line       #d8d0c4   table borders, hairlines

  GRAMMAR (the page vocabulary — use these blocks, in roughly this order):
    .kicker          gold caps eyebrow ("PROFESSIONAL GUIDE / v1.0")
    h1 (+ .sm)       title;  .sub subtitle;  .rule (or .rule.gold) divider
    .spec            bordered spec strip, 4–5 cells (yield / time / etc.)
    h2 (+ .note)     section header w/ gold underline; .note = right-aligned caption
    .cols / .col     two-column layout
    table.ing        ingredient table (td.amt right-aligned bold; .mut muted)
    .tag             small gold label for sub-grouping inside a column
    ol.steps         gold-circle numbered method
    .callout         cream box, gold left-bar — for the ONE key technique per page
    table.diag       diagnostics / targets (td.sym = shaded label cell)
    .foot            footer: kitchen · spec · page N/M  (VERSION-STAMP every page)

  HARD RULES (learned the hard way — see LESSONS.md):
    • Filenames: ONE dot only before .pdf (iOS mislabels multi-dot PDFs as "data").
    • NEVER sed lines containing HTML entities (&mdash; &deg; etc.) — use Python replace.
    • Multi-stage cooks: put temp targets ON EACH PAGE for that stage, not one dashboard.
      Resolve vague heat ("medium-low") to an IR number.
    • Every page MUST pass overflow_check (footer collision). Page count is NOT an
      overflow test — overflow:hidden clips the overrun invisibly.
    • Units: weigh in grams; keep counts for whole items (eggs, cardamom pods, bay).
      Liquids may stay ml. No bare tsp/tbsp.
-->
<head>
<meta charset="UTF-8">
<style>
  :root{
    --char-black:#1a1714;
    --broth-gold:#c8941e;
    --smoke-gray:#6b6560;
    --paper:#f7f4ee;
    --line:#d8d0c4;
  }
  @page{ size:letter; margin:0; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--char-black); background:var(--paper); }
  .page{ width:8.5in; height:11in; padding:0.55in 0.7in; position:relative; page-break-after:always; overflow:hidden; }
  .page:last-child{ page-break-after:auto; }

  .kicker{ font-size:8.5pt; letter-spacing:.32em; text-transform:uppercase; color:var(--broth-gold); font-weight:700; }
  h1{ font-size:28pt; line-height:1.02; letter-spacing:-.01em; margin:5px 0 4px; font-weight:800; }
  h1.sm{ font-size:23pt; }
  .sub{ font-size:9pt; color:var(--smoke-gray); letter-spacing:.02em; }
  .rule{ height:3px; background:var(--char-black); margin:11px 0 0; }
  .rule.gold{ background:var(--broth-gold); }

  .spec{ display:flex; gap:0; margin:14px 0 4px; border:1px solid var(--line); }
  .spec div{ flex:1; padding:8px 10px; border-right:1px solid var(--line); }
  .spec div:last-child{ border-right:none; }
  .spec .lab{ font-size:7pt; letter-spacing:.16em; text-transform:uppercase; color:var(--smoke-gray); font-weight:700; }
  .spec .val{ font-size:11.5pt; font-weight:800; margin-top:2px; }

  h2{ font-size:10pt; letter-spacing:.2em; text-transform:uppercase; color:var(--char-black);
      font-weight:800; margin:15px 0 7px; padding-bottom:4px; border-bottom:2px solid var(--broth-gold);
      display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  h2 .note{ font-size:7.5pt; letter-spacing:.08em; color:var(--smoke-gray); font-weight:600; text-transform:none; text-align:right; flex:0 1 auto; white-space:normal; }
  h2 .pt{ flex:0 0 auto; color:var(--broth-gold); }

  .cols{ display:flex; gap:22px; }
  .col{ flex:1; }

  table.ing{ width:100%; border-collapse:collapse; font-size:9pt; }
  table.ing td{ padding:3.5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  table.ing td.amt{ text-align:right; font-weight:800; white-space:nowrap; width:100px; color:var(--char-black); }
  table.ing td.pct{ text-align:right; font-weight:700; white-space:nowrap; width:50px; color:var(--smoke-gray); font-size:8pt; }
  table.ing tr:last-child td{ border-bottom:none; }
  .ing .mut{ color:var(--smoke-gray); }

  ol.steps{ list-style:none; counter-reset:s; margin-top:4px; }
  ol.steps li{ counter-increment:s; position:relative; padding:5px 0 5px 26px; font-size:9pt; line-height:1.4; border-bottom:1px solid var(--line); }
  ol.steps li:last-child{ border-bottom:none; }
  ol.steps li::before{ content:counter(s); position:absolute; left:0; top:5px; width:17px; height:17px;
      background:var(--broth-gold); color:var(--char-black); font-size:8pt; font-weight:800;
      border-radius:50%; text-align:center; line-height:17px; }
  ol.steps b{ font-weight:800; }
  ol.steps.c6{ counter-reset:s 6; }   /* continue numbering across a column break */

  .callout{ background:#efe9dd; border-left:3px solid var(--broth-gold); padding:9px 12px; margin:10px 0; font-size:8.5pt; line-height:1.45; }
  .callout b{ font-weight:800; }

  .diag{ width:100%; border-collapse:collapse; font-size:8.5pt; margin-top:4px; }
  .diag td,.diag th{ padding:5px 8px; border:1px solid var(--line); vertical-align:top; text-align:left; }
  .diag td.sym{ font-weight:800; width:26%; background:#efe9dd; }
  .diag th{ font-size:7pt; letter-spacing:.14em; text-transform:uppercase; color:var(--smoke-gray); background:#efe9dd; }

  .foot{ position:absolute; bottom:0.4in; left:0.7in; right:0.7in; display:flex; justify-content:space-between;
         font-size:7pt; letter-spacing:.15em; text-transform:uppercase; color:var(--smoke-gray); border-top:1px solid var(--line); padding-top:6px; }

  p.lead{ font-size:9pt; line-height:1.45; margin:6px 0; }
  .mut{ color:var(--smoke-gray); }
  .tag{ display:block; font-size:7pt; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:var(--broth-gold); margin:9px 0 3px; }
  .tag:first-child{ margin-top:0; }
</style>
</head>
<body>

<!-- ============ PAGE SKELETON — copy a .page block per page ============ -->
<div class="page">
  <div class="kicker">Section Guide &nbsp;/&nbsp; v1.0</div>
  <h1>Recipe Title</h1>
  <div class="sub">one-line descriptor &middot; key &middot; attributes</div>
  <div class="rule"></div>

  <div class="spec">
    <div><div class="lab">Yield</div><div class="val">—</div></div>
    <div><div class="lab">Active</div><div class="val">—</div></div>
    <div><div class="lab">Key Ratio</div><div class="val">—</div></div>
    <div><div class="lab">Bake / Cook</div><div class="val">—</div></div>
  </div>

  <h2>Section <span class="note">right-aligned caption</span></h2>
  <!-- ingredient table / steps / diag / callout go here -->

  <!-- Per-stage temp targets live on THE PAGE for that stage, e.g.: -->
  <h2>Temp Targets <span class="note">this stage</span></h2>
  <table class="diag">
    <tr><td class="sym">Stage</td><td>Target &mdash; with the failure it prevents.</td></tr>
  </table>

  <div class="foot"><span>Aguillon House Kitchen</span><span>Recipe Name v1.0 &middot; section</span><span>Page 1 / N</span></div>
</div>

</body>
</html>
